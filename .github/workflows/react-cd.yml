name: React CD

on:
  workflow_run:
    workflows: ["React CI"]
    types:
      - completed
    
permissions:
        actions: read  # Required for workflow_run to work
        contents: read


jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./budget-tracker-react/package-lock.json

      - name: Install dependencies
        working-directory: ./budget-tracker-react
        run: npm ci

      - name: Build project
        working-directory: ./budget-tracker-react
        run: npm run build  

      - name: Build frontend Docker image
        run: docker build -t budgettracker-frontend:latest ./budget-tracker-react
