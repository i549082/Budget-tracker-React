name: React CI

on:
  push:
    branches: [master, dev, main]
  pull_request:
    branches: [master, dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./budget-tracker-react/package-lock.json

      - name: Install dependencies
        working-directory: ./budget-tracker-react
        run: npm ci

      - name: Type check (TypeScript)
        working-directory: ./budget-tracker-react
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: ./budget-tracker-react
        run: npm test --if-present

      - name: Build project
        working-directory: ./budget-tracker-react
        run: npm run build
